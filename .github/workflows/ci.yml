name: CI
on:
  pull_request:
  push:
    branches:
      - main
      - "ci/**"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-node:
    # Ubuntu 26.04 is currently the official GitHub-hosted image that provides
    # OpenSSL 3.5+, required for ML-DSA-65 in the TFWS hybrid-signature tests.
    runs-on: ubuntu-26.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify OpenSSL requirements
        run: |
          openssl version
          python3 - <<'PY'
          import re
          import subprocess

          version_text = subprocess.check_output(
              ["openssl", "version"], text=True
          ).strip()
          match = re.match(r"OpenSSL\s+(\d+)\.(\d+)\.(\d+)", version_text)
          if not match:
              raise SystemExit(f"Cannot parse OpenSSL version: {version_text}")

          version = tuple(map(int, match.groups()))
          if version < (3, 5, 0):
              raise SystemExit(
                  f"OpenSSL 3.5+ required, found {version_text}"
              )

          algorithms = subprocess.check_output(
              ["openssl", "list", "-signature-algorithms"], text=True
          )
          for required in ("ED25519", "ML-DSA-65"):
              if required.lower() not in algorithms.lower():
                  raise SystemExit(
                      f"Required signature algorithm missing: {required}"
                  )

          print("OpenSSL version and signature algorithms: PASS")
          PY
      - run: python3 -m pip install --disable-pip-version-check .[test]
      - name: Test Python CBOR/COSE interoperability
        run: PYTHONPATH=reference/python python3 -m unittest discover -s reference/python/tests -p test_core.py -v
      - name: Test Python Issue 7 vector conformance
        run: PYTHONPATH=reference/python python3 -m unittest discover -s reference/python/tests -p test_issue7_cbor_cose_conformance_vectors.py -v
      - name: Regenerate and compare deterministic vectors
        shell: bash
        run: |
          set -euo pipefail
          vector_temp="${RUNNER_TEMP}/tfws-issue9-vectors"
          mkdir -p "${vector_temp}"
          python3 scripts/generate_issue7_cbor_cose_vectors.py \
            --manifest test-vectors/manifest.valid.json \
            --output "${vector_temp}/issue7-cbor-cose-cross-language-v1.json" \
            --digest-output "${vector_temp}/issue7-cbor-cose-cross-language-v1.sha256" \
            --schema test-vectors/hybrid-signature-v1/issue7-cbor-cose-cross-language-v1.schema.json \
            --self-test
          cmp \
            test-vectors/hybrid-signature-v1/issue7-cbor-cose-cross-language-v1.json \
            "${vector_temp}/issue7-cbor-cose-cross-language-v1.json"
          cmp \
            test-vectors/hybrid-signature-v1/issue7-cbor-cose-cross-language-v1.sha256 \
            "${vector_temp}/issue7-cbor-cose-cross-language-v1.sha256"
      - run: PYTHONPATH=reference/python python3 -m unittest discover -s reference/python/tests -v
      - run: node --test sdks/typescript/test/*.test.mjs
      - run: python3 scripts/validate_repository.py
  rust:
    name: rust (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-latest
            runner: ubuntu-26.04
          - label: windows-latest
            runner: windows-latest
          - label: macos-latest
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select OpenSSL 3.5+ on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path -Path $env:ProgramFiles -ChildPath "OpenSSL\bin\openssl.exe")
            "C:\msys64\ucrt64\bin\openssl.exe"
          )
          $openssl = $null

          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              $openssl = $candidate
              break
            }
          }

          if ([string]::IsNullOrWhiteSpace($openssl)) {
            throw (
              "Required OpenSSL executable was not found in approved locations: {0}" -f
                ($candidates -join ", ")
            )
          }

          "TFWS_OPENSSL=$openssl" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $openssl) |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Select OpenSSL 3.5+ on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          openssl_path="$(command -v openssl)"
          echo "TFWS_OPENSSL=${openssl_path}" >> "${GITHUB_ENV}"
      - name: Verify Rust OpenSSL requirements
        shell: pwsh
        run: |
          $openssl = $env:TFWS_OPENSSL

          if ([string]::IsNullOrWhiteSpace($openssl) -or
              -not (Test-Path -LiteralPath $openssl -PathType Leaf)) {
            throw "TFWS_OPENSSL is missing or invalid: $openssl"
          }

          $versionText = (& $openssl version).Trim()

          if ($LASTEXITCODE -ne 0 -or
              $versionText -notmatch '^OpenSSL\s+(\d+)\.(\d+)\.(\d+)') {
            throw "Cannot parse OpenSSL version: $versionText"
          }

          $version = [Version]::new(
            [int]$Matches[1],
            [int]$Matches[2],
            [int]$Matches[3]
          )

          if ($version -lt [Version]"3.5.0") {
            throw "OpenSSL 3.5+ required, found $versionText"
          }

          $algorithms = (& $openssl list -signature-algorithms) -join "`n"

          if ($LASTEXITCODE -ne 0) {
            throw "OpenSSL signature algorithm listing failed"
          }

          foreach ($required in @("ED25519", "ML-DSA-65")) {
            if ($algorithms.IndexOf(
                    $required,
                    [System.StringComparison]::OrdinalIgnoreCase
                ) -lt 0) {
              throw "Required signature algorithm missing: $required"
            }
          }

          Write-Host $versionText
          Write-Host "OpenSSL version and signature algorithms: PASS"
      - name: Verify Windows OpenSSL signing operations
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $openssl = $env:TFWS_OPENSSL

          if ([string]::IsNullOrWhiteSpace($openssl) -or
              -not (Test-Path -LiteralPath $openssl -PathType Leaf)) {
            throw "TFWS_OPENSSL is missing or invalid: $openssl"
          }

          $probeRoot = Join-Path $env:RUNNER_TEMP (
            "tfws-openssl-signing-probe-{0}-{1}" -f
              $env:GITHUB_RUN_ID,
              $env:GITHUB_RUN_ATTEMPT
          )
          $messagePath = Join-Path $probeRoot "message.bin"

          function Invoke-OpenSslProbe {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Label,

              [Parameter(Mandatory = $true)]
              [string[]]$Arguments
            )

            Write-Host "::group::$Label"
            $previousPreference = $ErrorActionPreference

            try {
              $ErrorActionPreference = "Continue"
              $output = @(& $openssl @Arguments 2>&1)
              $exitCode = $LASTEXITCODE
            }
            finally {
              $ErrorActionPreference = $previousPreference
            }

            foreach ($line in $output) {
              Write-Host ([string]$line)
            }

            Write-Host "Exit code: $exitCode"
            Write-Host "::endgroup::"

            if ($exitCode -ne 0) {
              throw "$Label failed with exit code $exitCode"
            }
          }

          if (Test-Path -LiteralPath $probeRoot) {
            Remove-Item -LiteralPath $probeRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $probeRoot -Force |
            Out-Null

          try {
            [System.IO.File]::WriteAllBytes(
              $messagePath,
              [System.Text.Encoding]::UTF8.GetBytes(
                "TFWS Windows OpenSSL signing probe"
              )
            )

            $identity = (& whoami).Trim()

            if ($LASTEXITCODE -ne 0 -or
                [string]::IsNullOrWhiteSpace($identity)) {
              throw "Cannot resolve the Windows runner identity"
            }

            $grant = "${identity}:(OI)(CI)F"
            $aclOutput = @(
              & icacls.exe $probeRoot `
                /inheritance:r `
                /grant:r `
                $grant `
                2>&1
            )
            $aclExitCode = $LASTEXITCODE

            foreach ($line in $aclOutput) {
              Write-Host ([string]$line)
            }

            if ($aclExitCode -ne 0) {
              throw "Windows signing-probe ACL setup failed"
            }

            $profiles = @(
              @{
                Label = "ED25519"
                OpenSslName = "ED25519"
                Prefix = "ed25519"
                ExpectedSignatureLength = 64
              },
              @{
                Label = "ML-DSA-65"
                OpenSslName = "ML-DSA-65"
                Prefix = "ml-dsa-65"
                ExpectedSignatureLength = 3309
              }
            )

            foreach ($profile in $profiles) {
              $privateKey = Join-Path $probeRoot (
                "{0}-private.pem" -f $profile.Prefix
              )
              $publicKey = Join-Path $probeRoot (
                "{0}-public.pem" -f $profile.Prefix
              )
              $signature = Join-Path $probeRoot (
                "{0}-signature.bin" -f $profile.Prefix
              )

              Invoke-OpenSslProbe `
                -Label "$($profile.Label) key generation" `
                -Arguments @(
                  "genpkey",
                  "-algorithm",
                  $profile.OpenSslName,
                  "-out",
                  $privateKey
                )

              Invoke-OpenSslProbe `
                -Label "$($profile.Label) public-key derivation" `
                -Arguments @(
                  "pkey",
                  "-in",
                  $privateKey,
                  "-pubout",
                  "-out",
                  $publicKey
                )

              Invoke-OpenSslProbe `
                -Label "$($profile.Label) signing" `
                -Arguments @(
                  "pkeyutl",
                  "-sign",
                  "-inkey",
                  $privateKey,
                  "-rawin",
                  "-in",
                  $messagePath,
                  "-out",
                  $signature
                )

              Invoke-OpenSslProbe `
                -Label "$($profile.Label) verification" `
                -Arguments @(
                  "pkeyutl",
                  "-verify",
                  "-pubin",
                  "-inkey",
                  $publicKey,
                  "-rawin",
                  "-in",
                  $messagePath,
                  "-sigfile",
                  $signature
                )

              $signatureLength = (
                Get-Item -LiteralPath $signature
              ).Length

              if ($signatureLength -ne
                  [int64]$profile.ExpectedSignatureLength) {
                throw (
                  "{0} signature length mismatch: actual={1}; expected={2}" -f
                    $profile.Label,
                    $signatureLength,
                    $profile.ExpectedSignatureLength
                )
              }

              Write-Host (
                "{0} functional signing probe: PASS / {1} bytes" -f
                  $profile.Label,
                  $signatureLength
              )
            }
          }
          finally {
            if (Test-Path -LiteralPath $probeRoot) {
              Remove-Item -LiteralPath $probeRoot -Recurse -Force
            }
          }
      - run: rustc --version
      - run: cargo --version
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - name: Test deterministic CBOR codec
        run: cargo test --package tfws-core --test cbor_codec --locked
      - name: Test COSE hybrid envelope
        run: cargo test --package tfws-core --test cose_envelope --locked
      - name: Test OpenSSL provider
        run: cargo test --package tfws-openssl-provider --locked
      - name: Test Issue 7 Rust vector conformance
        run: cargo test --package tfws-core --test issue7_cbor_cose_conformance_vectors --locked
      - name: Test explicit CLI formats and negative vectors
        run: cargo test --package tfws-cli --locked
      - name: Exercise deterministic CBOR codec through WASM interface
        run: cargo test --package tfws-wasm --locked
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --all-targets --locked
      - run: cargo build --package tfws-wasm --target wasm32-unknown-unknown --locked
